name: Test CLARITY
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-lock.txt
      - run: python -m pip install --no-deps -e '.[dev]'
      - run: python -m pytest
      - run: python -m ruff check src tests scripts publication.py build_backend.py
      - run: python -m ruff format --check src tests scripts publication.py build_backend.py
      - run: python -m build --no-isolation
