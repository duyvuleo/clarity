[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clarity-nl2sql"
version = "0.1.1"
description = "CLARITY benchmark and conversational NL2SQL ambiguity generation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "CLARITY contributors"}]
dependencies = [
  "langchain-core>=0.3.78,<0.4",
  "langchain-openai>=0.3.35,<0.4",
  "langgraph>=0.3.11,<0.4",
  "pydantic>=2.10,<3",
  "pandas>=2.2,<3",
  "sqlglot==30.21.0",
  "PyYAML>=6,<7",
  "tqdm>=4.67,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-socket>=0.7,<1", "ruff>=0.9,<1", "build>=1,<2"]

[project.scripts]
clarity = "clarity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clarity = ["prompts/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--disable-socket"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
