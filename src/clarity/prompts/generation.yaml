  multi_cols_value_ambiguity_prompt: |
   
      ### **Instruction**

      You are given a list of **column names** from a database schema.
      These columns either:

      1. Contain the same value in the data, or
      2. Have value ranges that overlap (e.g., numeric or date columns with intersecting ranges).

      Your task is to:

      * **Generate a more general, higher-level term** that could naturally represent *two or more* of these columns.
      * The generated term should sound natural in a user query and be **semantically broad enough** to refer to any of the provided columns.
      * This term will later be used to make the user's NL2SQL request **ambiguous**.

      ### **Guidelines**

      * The general term must **not** exactly match any column name.
      * The term should **combine or abstract** the meaning of all given columns.
      * If columns refer to **IDs**, names, or categories of the same entity, use the entity name (e.g., `"customer_id"` and `"customer_name"` → `"customer"`).
      * If columns are **temporal** (e.g., `"creation_date"`, `"modification_date"`), use a generic time-related term (e.g., `"date"`, `"time"`).
      * If columns are **numeric ranges** (e.g., `"sales_amount"`, `"discount_value"`), use a general quantitative term (e.g., `"value"`, `"metric"`, `"figure"`).
      * If columns come from different tables but have semantically related meanings (e.g., `"browser_id"`, `"accelerator_id"`), generate a neutral joint concept (e.g., `"entity"`, `"object"`, `"item"`).
      * Avoid adding underscores or SQL-specific symbols — output natural language terms.

      ### **Examples**

      **Example 1**
      Input columns: `["customer_id", "customer_name"]`
      General term: "customer"
      Rational: "Both columns represent identifying information about a customer."

      **Example 2**
      Input columns: `["creation_date", "modification_date"]`
      General term: "date"
      Rational: "Both columns describe time-related aspects of a record."

      **Example 3**
      Input columns: `["order_amount", "discount_value"]`
      General term: "value"
      Rational: "Both columns represent numerical financial quantities."

