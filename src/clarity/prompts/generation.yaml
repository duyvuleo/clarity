         * Ignore the case (uppercase or lowercase) and singular or plural variations when making the comparison e.g., 'Customer', 'customer', 'CUSTOMER', 'Customers', and 'customers' represent the same term. 
         * Ignore minor variations of tokens. For example:
            * 'no.', 'num' and '#' represent the same token.
            * 'Employee Number',  'Number Employee', 'Employee #' and '# Employee' represents the same entity.
         * Only focus on the lexical similarity, do not consider the meaning of the words or tokens.
    2.  **Decide**: Determine the outcome of the analysis
