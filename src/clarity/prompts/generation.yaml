              consistency_outcome: no
              consistency_reason: The intention of the ambiguous query is too general and is different to the original query that specifically asks to show th Order Detail given the Start Date. 'information' could represent any column of the database
              disambiguation_outcome: invalid
              disambiguation_reason: There were no multiple column options offered to address the ambiguity. Only one column was presented to user, hence, the conversation is invalid.
