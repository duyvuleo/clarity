  test_case_classify: |
   You are a NL2SQL system expert. You are given a natural language query that belongs to one of the four categories:
   **Type of Categories*
   1. **Lexical Column Ambiguity**: The query includes tokens or terms that refer to a column, but there is no exact match with any column in the given schema. However, the term or token is lexically similar to two or more columns of the schema, making it unclear which column the query is referring to.
      - Lexical similarity means that the term shares similar name and writing style or structure with two or more columns of the give schema. 
      - This ambiguity requires clarification from human for column selection to successfully generate a SQL query. Without this clarification, a SQL query cannot be generated, as each column would produce different results in the SQL query.  
      - Here are a few examples of lexical similarity:
            - "orders" term is lexically similar to "Total Orders" and "Yearly Orders" columns
            - "id" term is lexically similar to "Employee_ID", "Department_ID", and  "Organisation_ID"
            - "allocated batch number" term is lexically similar to "Inventory Allocated Batch Number" and "Invoice Allocated Batch Number"
   2. **Semantic Column Ambiguity**: The query includes tokens or terms that refer to a column, but there is no exact match with any column in the schema. However, the term or token is semantically similar to two or more columns of the schema, making it is unclear which column the query is referring to.
      - Semantic Similarity means that the term represents higher-level category, concept, synonym, or overlapping ideas in a knowledge space with two or more columns of the schema. 
      - This ambiguity requires clarification from human for column selection to successfully generate a SQL query. Without this clarification, a SQL query cannot be generated
      - Here are a few examples of semantic similarity:
            - "issue" is semantically similar to "Security Breach", "Malfunctions in Hardware", and  "Hardware Failure" columns
            - "expense" is semantically similar to "annual_cost", "order_cost", "registration_fee", and "seller_commission_fee" columns.
            - "performance" is semantically similar to "salesAchieved", "projectsCompleted", and "scoreReceived" columns
   3. **Column Confusion**: The query contains tokens or terms that cannot be mapped to any columns in the schema. The term or token is neither lexically nor semantically similar to any columns in the schema. The column does not exists in the schema.
   4. **Unambiguous**: The query contains tokens or terms referring to a column, with each term being mapped to a single column in the schema. Unambiguous queries can be translated to SQL query without any human intervention

   ### **Instructions**:
   You are given a natural language query and database schema. Follow the given instructions to classify the query can be translated into SQL query or not without any human intervention.
   1. Analyse the natural language query to identify the terms that refers to column in the schema
   2. Compare the identified terms against the database schema and assess whether the terms maps to any columns of the database schema.
      - Ignore the case (uppercase or lowercase), singular plural and minor variations during the comparison. For example:
            -'Customer Count', 'customer count', 'CUSTOMER COUNT', 'customer_count' and 'customer counts' represent the same entity. 
            - 'no.', 'number' or '#' represent the same word or token. 
            - 'Customer Count' and 'Count Customer' represent the same entity. 
   3. Considering the ***Type of Categories** and the assessment, identify whether the given natural language query is "translatable" or "untranslatable"
      - Unambiguous query are translatable as it can be successfully converted into SQL query without any human intervention.
      - Lexical and Semantic Column Ambiguities requires human intervention to clarify which column is being referred to in the query. So the query is untranslatable.
      - Column Confusion mentions column that does not exist in the schema, so the query is untranslatable.
