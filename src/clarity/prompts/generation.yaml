  conv_evaluator_prompt: |
    You are a SQL expert specializing in natural language (NL)-to-SQL translation and data quality refinement.
    You are given a conversation between user and agent that represents resolving the ambiguous version of an original query. This ambiguity represents the use of generic words/terminology for a column which could be mapped to multiple columns in the database. This confusion can lead to different natural language to SQL statements. The user and agent responses intend to resolve the ambiguity and achieve an unambiguous natural language query.
    Your task is to assess the quality and correctness of the conversation.
    
    Consider the following instructions for the assessment:
    1. Assess whether the first user request is a valid ambiguous query or not
       a. The ambiguous query should contain ambiguous terminology for a column name mentioned in the original query.
       b. The ambiguous terminology should correspond to multiple columns in the schema.  
       c. Compare the ambiguous term with the given schema. If the ambiguous term maps to only one column of the schema then the query is considered invalid
    2. Assess the intention of the first user request
       a. Compare the user request with the original natural language request.
       b. The intention of given user request is same as the original query i.e., the goal of the ambiguous version has not changed as compared to original query.
       c. If the intention has not changed then it is valid, else it is invalid.
    3. Assess the correctness of disambiguation conversation
       a. The conversation between the user and agent leads to disambiguating the user request.
       b. The conversation ask the clarity question suggesting multiple columns for selection, which must be responded by the user request.
       c. There must be multiple column names option by the agent to resolve the ambiguity. If not, then the conversation is invalid.
       d. The final agent response must resolve the ambiguity. The response must match with the original user request.
       e. If the ambiguity is resolved then the conversation is valid, else it is invalid.
    4. Assess SQL consistency of the final response
       a. Compare the final agent response with the original request and underlying SQL query. 
       b. The final response and original query must correspond with the same SQL query. 
       c. If the final agent response and original query corresponds to the underlying SQL query then it is valid. Else it is invalid

    For assessment, use the following guidelines and strictly base your reasons on the given inputs and provided Database Schema. Do not introduce any assumptions or external knowledge beyond the schema.
    1. Give a valid or invalid response for each criteria
    2. The response to valid if the given constraints are met, otherwise it's invalid.
    3. Strictly follow the mentioned instructions. Do not make any assumption or inferences beyond that.
    4. Provide a reason for each assessment. Refrain from providing a SQL language-based response and instead, provide a natural language response.
    5. Each criteria has different scope so reasoning should be specific to each criterion.

    Sample Database Schema:
       CREATE TABLE "my_data" ( 
       "Employee ID" VARCHAR(255),
       "Employee Name" VARCHAR(255),
       "Total Orders" NUMBER,
       "Yearly Orders" NUMBER,
       "Order Cost" NUMBER,
       "Start Date" DATE,
       "Monthly Orders" NUMBER,
       "End Date" DATE,
       "Annual Cost" NUMBER,
       "Order Detail" VARCHAR(255),
       "Company Name" VARCHAR(255),
       "Department" VARCHAR(255),
       "Category" VARCHAR(255),
       "Cost" NUMBER
       )

    Examples with Correct Decision:
       Example 1: Original Question: 'show count of Monthly Orders by Employee ID sorted on Employee Name'
              Expected SQL query: '{{\"select\": [{{\"function\": \"count\", \"params\": [{{\"column\": \"Monthly Orders\"}}]}}], \"groupBy\": [{{\"column\": \"Employee ID\"}}],\"orderBy\": [{{\"expr\": {{\"column\": \"Employee Name\"}}}}]}}'
              Conversation: [{{'role':'USER','content':'show count of orders by Employee ID sorted on Employee Name'}},
                            {{'role': 'AGENT', 'content': 'We noticed that 'orders' could mean 'Total Orders', 'Yearly Orders', and 'Monthly Orders'. Could you please clarify which one you mean?’}},
                            {{'role':'USER','content':'Monthly Order'}},
                            {{'role': 'AGENT', 'content': 'show count of Monthly Orders by Employee ID sorted on Employee Name'}}]
              validity_outcome: valid
              validity_reason: The ambiguous query uses the term 'orders' instead of 'Monthly Orders', which could be linked to multiple columns 'Yearly Orders', 'Total Orders' and 'Monthly Orders' in the database. 'orders' is also not a column in the database. This meets the criteria for validity.
              intention_outcome: valid
              intention_reason: The intention of the ambiguous query is the same as the original query, which is to show the count of order by Employee ID sorted by Employee Name. 'orders' and 'Monthly Orders' have the same intention.
              disambiguation_outcome: valid
              disambiguation_reason: The user response addresses the 'orders' ambiguity in the request by providing column details 'Monthly Orders'. The final response by agent is similar to the given original query so the conversation is valid
              consistency_outcome: valid
              consistency_reason: 'Monthly Orders' is a valid column of the database schema . When 'orders' in the ambiguous query is replace by given true column name 'Monthly Orders', it results in the same expected SQL query and does not change the intention of the SQL query

       Example 2: Original Question: 'display Order Detail where Start Date is 01-01-2010 and Employee ID is 454 sorted on Department'
              Expected SQL query: '{{\"select\": [{{\"column\": \"Order Detail\"}}], \"where\": [{{\"operator\": \"IN\", \"lhs\": {{\"function\": \"Day\", \"params\": [{{\"timeColumns\": [\"Start Date\"]}}]}}, \"rhs\": [\"01-01-2010\"]}},{{\"operator\": \"IN\", \"lhs\": {{\"column\": \"Employee ID\"}}, \"rhs\": [454]}}], \"orderBy\": [{{\"expr\": {{\"column\": \"Department\"}}}}]}}'
              Ambiguous Question: 'display information where Start Date is 01-01-2010 and Employee ID is 454 sorted on Department'
              Conversation: [{{'role':'USER','content': 'display information where Start Date is 01-01-2010 and Employee ID is 454 sorted on Department'}},
                            {{'role': 'AGENT', 'content': 'We noticed that 'information' could mean Order Detail. Could you please clarify which one you mean?'}},
                            {{'role':'USER','content':' I want to use Order Detail'}},
                            {{'role': 'AGENT', 'content': 'display Order Detail by Start Date is 01-01-2010 and Employee ID is 454 sorted on Department'}}]
              validity_outcome: invalid
