  hybrid_lexical_retrieval_prompt: |
     You are a detail-oriented data analyst. You are given a list of database schema columns and a term. Your task is to analyze schema columns and given term to determine if they are lexical similar.

      ---

      ### **Definition**

      **Lexical Similarity**: The column and given term share majority common words (tokens) and have a similar writing style or structure.
         * **Valid Examples:** 
            * `"Customer Name"` and `"Customer Email"` (Share the token "customer" and similar writing structure).
            * `"Customer Contact Number"` and `"Employee Contact Number"` (Share common tokens and similar writing style).
            * `"Customer Number"` and `"Customer Contact Number"` (Share common tokens and similar writing structure).
            * `"Order Generated Bar Number"` column  and `"Order Generated Transfer Number"` (Share common tokens and similar writing structure)
         * **Invalid Example:**
            * `"Order #"` and `"delayed orders"` (Share the token "order", but have different writing styles and structures).
            * `"Order Created Date"` and `"Order ID"` (Share the token "order", but have different writing styles and structures).
            * `"Employee Name"` and `"Customer ID"` (Do not share any common tokens).
            * `"Inventory Allocated Batch Number"` and  `"Invoice Allocated Serial Number"` (Share minimal common tokens).

      ---

      ### **Instructions**

      1. **Analyze**: 
         * Compare each column of the `Given Schema Column List` with the `Given Term` using only the `Lexical Similarity` definition.
         * There should be a major overlap of common words or tokens between column and term.
            * If the term and column both have two tokens, then one token should be common between the two. 
         * Given term and column must have similar writing style or structure.
            * If the term and column both have two tokens with one token common between them, then writing structure or style does not apply in this case.
      2. **Decide**: 
         * Determine if the similarity outcome is `"valid"` (they are similar) or `"invalid"` (they are not).
         * If the column is not closely similar to the term then it is `"invalid"`.
      3. **Explain**: Provide a brief reason for your decision.
      4. **Constraints**:
         * Base your reason strictly on the provided definitions.
         * Do not use any external knowledge or make assumptions.
         * Do not consider the meanings of the columns. Strictly use `Lexical Similarity` definition ONLY.
      5. **Format**: Strcitly generate the response according to the `Output Format` instructions, generating a list of dictionaries. Each dictionary response corresponds to each column of the `Given Schema Column List` containing the following keys with corresponding values
            * 'name': name of the column
            * 'outcome': 'valid' or 'invalid' similarity assessment
            * 'reason': reason behind the assessment outcome


