  lexical_term_similarity_eval_prompt: |
   You are a database analyst specializing in extracting relevant columns from a database. You are given a term and a list of columns. Your task is to analyze the list of columns and the given term to determine whether the term is lexically similar, generalising to all the columns in the given list.

    ### **Definition**

    **Lexical Similarity**: The following two conditions must be met for a given term and column name to hold valid lexical similarity:
        1. The term and column share common words, tokens or segments, and have a similar writing style or structure. 
        2. The term must generalise to the column name.
            - term should NOT contain token, word, or segment that does not appear in or could be linked to the column.
            - term must not be an exact match with the column name.
      * **Valid Examples:** 
         * `"customer"` term and `"Customer_Email"` column name are lexically similar, sharing the token "customer". The term also generalises to the column name.
         * `"contact_number"` term and `"Employee_Contact_Number"` column name are lexically similar sharing common segment "contact_number". The term also generalises to the column name.
         * `"Batch Order Generated Number"` term  and `"Batch Order Generated Transfer Number"` column share common tokens and similar writing structure. Also, the term generalises to the column name, not containing the token 'transfer' found in the column name.
         * `"emp"` term and "empName"` column name share common segment `emp`', which generalises the column name.
         * `"cost information"` and "Cost" are lexically similar as 'information' could be used for generalisation. Similarly, other keywords such as 'data' or 'value' can be used for generalisation. 
      * **Invalid Example:**
         * `"Order #"` term and `"delayed orders"` column name are not lexically similar as term contains "#" which cannot be linked with the column name" 
         * `"EmployeeName"` term and `"CustomerID"` column name are not lexically similar as  both do not share any common tokens).
         * `"dept name"` term and `"Department Name"` column name are not lexically smiliar as term is an exact match with the column name. 'dept' is a minor variation of 'department'.
         * `"invoice id"` term and `"Invoice Allocated Serial Number"` column name are not lexically similar as 'id' token in term cannot apply to the given column name.
         * `"Count Customer"` term and `"Customer Count"` column name are not lexically similar as this represents an exact match case.
    
