prompts:
  lexical_term_prompt: |
     You are a SQL expert specializing in natural language (NL)-to-SQL translation and data generation.
     You are given a column of interest and list of similar columns. Your task is to analyze the list of similar columns and identify a subset of columns that similar to the given column of interest, which might cause ambiguity if referenced without enough detail in a query. Ambiguity arises when multiple columns have similar names or overlapping meanings, making it unclear which one should be used.  
     
     ### **Instructions**
     The following instructions must be strictly followed:
     1. **Group Selection**: Identify groups of columns that are lexically similar to the given column of interest  
        - Identify the columns that have similar names and writing style or structure to the column of interest and group them. 
        - The column of interest and selected columns must share common tokens, words or segments.
          - If there are many column names which are similar to the column of interest, then select the ones that share most tokens, words or segments.
        - The group should contain one or more columns from the given list.
     2. **Term Generation**: Generate an ambiguous term for the column of interest that can likely be asked by a human database manager and cause ambiguity with the selected columns group using the following rules:
        - The ambiguous term should be lexically similar to column of interest in terms of wording, length, and style.
        - The ambiguous term should NOT be an exact match with column of interest and any column from the selected column list i.e., the term should be slightly different to all the columns in the list and should not exactly match with any of the columns.
        - The ambiguous term should NOT contain token, word, or segment from column(s) of the selected group which does not appear in the column of interest e.g., for "employee name" column of interest, "manager employee" is an invalid as token 'manager' token exists in selected column groups, ["Manager Employee Name", "Manager Employee ID", "Manager Employee Contact"] but not in the column of interest.
        - The ambiguous term should NOT contain keyword or token that could be linked with a unique column e.g., for column of interest "Customer Number" and selected columns ["Customer Returning ID", "Customer Name"], "customer identifier' is an invalid ambiguous term as it can be associated with "customer Returning ID" instead of the column of interest. Moreover, it is also not associated with the column of interest.
        - The ambiguous term should NOT be a synonym or paraphrased word e.g., if we have two columns "Employee Title" and "Employee Designation" then "worker" term is invalid as it is a synonym of "Employee".
        - Do not use vague generic terms. For example, "count" for 'Number of People', 'Number of Cities' or 'Number of Countries' columns is an invalid ambiguous term.     
        - Ignore the case (uppercase or lowercase), singular plural and minor variations when generating an ambiguous term for the selected group. For example:
          -'Customer Count', 'customer count', 'CUSTOMER COUNT', 'customer_count' and 'customer counts' represent the same column. 
          - 'no.', 'number' or '#' represent the same word or token. 
          - 'Customer Count' and 'Count Customer' represent the same column. 
        - If an ambiguous term cannot be generated when multiple lexically similar columns do not exist, then use 'Null' for ambiguous term.
     3. **Constraints**:
        - The ambiguous term and selected group must be specific to the column of interest, i.e., the ambiguous term is generated for the column of interest which causes ambiguity with the selected columns group.
          - For the ambiguous term, DO NOT use tokens, words or segments from columns of the selected group that do not appear in the column of interest.
          - The token, words or segments in ambiguous term must appear in both column of interest and the columns of the selected group.
        - Take into consideration the history, if provided, when generating the response. 
            - The history contain errors linked with the term generated in the previous attempt(s).
            - Strictly use the history to generate a valid ambiguous term.
        - Strictly generate the response considering the column of interest, similar columns list and given constraints. Do not introduce any assumptions or external knowledge beyond the given columns. 
        - Refrain from providing elaborative reasoning and only provide a short summarised reason, following the provided examples and output template. 
     4. **Format**: Strictly generate the response using the given output format. DO NOT generate any other content or text.
    
     ### **Examples**
        
     Example 1:
     Column of Interest: "Monthly Orders"
     Given List of Similar Columns: ["Total Orders", "Yearly Orders", "Order Dispatch Date" , "Order Invoice ID"]
     History: None
     Selected Group: ["Total Orders", "Yearly Orders"]
     Ambiguous Term: "orders"
     Reason: "The column of interest 'Monthly Orders' share common token 'orders' with all the columns in the selected list and 'orders' itself is not a column name in the given list."   

     Example 2:
     Column of Interest: "Customer_ID"
     Given List of Similar Columns: ["Employee_ID", "Employee_Name", "Department_ID", "Department_Name", "Organisation_ID"]
     History: None
     Selected Group: ["Employee_ID", "Department_ID", "Organisation_ID"]
     Ambiguous Term: "ID"
     Reason: "The column of interest 'Customer_ID' has 'ID' which also appears in the three selected columns and 'ID' itself is not a column name in the given list."   

     Example 3:
     Column of Interest: "Order Generated Transfer Number"
     Given List of Similar Columns: ["Order Generated Bar Number", "Parcel Generated Bar Number", "Order Generated Dispatch Number"]
     History:  None
     Selected Group: ["Order Generated Bar Number", "Order Generated Dispatch Number"]
     Ambiguous Term: "order generated number"
     Reason: "'Order Generated' and 'number' in the column of interest are common across the three selected columns. So 'order generated number' ambiguous term could be used as this is an exact column in the list"

     Example 4:
     Column of Interest: "Cost"
     Given List of Similar Columns: ["Annual Cost", "Order Date", "Order Cost", "Annual Profit", "Cost per Item"]
     History: "'cost' itself is a column name in the given list. So this is not a valid ambiguous term"
     Selected Group: ["Annual Cost", "Order Cost"]
     Ambiguous Term: "cost info"
     Reason: "cost info is ambiguous enough to cover column of interest and all the columns in the selected group list, avoiding exact match with any one of them"

     Example 5:
     Column of Interest: "Invoice Allocated Serial Number"
     Given List of Similar Columns: ["Inventory Allocated Batch Number", "Order Dispatch Batch Number", "Inventory Allocated Serial Number", "Invoice Allocated Batch Number"]
     History: None
     Selected Group: ["Inventory Allocated Batch Number", "Invoice Allocated Batch Number"]
     Ambiguous Term: "allocated batch number"
     Reason: "'allocated number' generalises to column of interest and selected columns, causing ambiguity in the selection of exact column name"

     Example 6:
     Column of Interest: "Manager_First_Name"
     Given List of Similar Columns: ["Manager_Contact", "Manager_Email", "Manager_Designation", "Department"]
     History: None
     Selected Group: ["Manager_Contact", "Manager_Email", "Manager_Designation"]
     Ambiguous Term: "Name"
     Reason: "The column of interest 'Manager_First_Name' contains 'Manager' which also appears in the three selected columns and 'Manager' itself is not a column name in the given list."  

     Example 7:
     Column of Interest: "Number of AC DC services"
     Given List of Similar Columns: ["Number of AC services", "AC services requested", "Price per AC service", "Number of paid services", "Number of unpaid services"]
     History: "'no. of AC services' is an invalid ambiguous term as it represents the actual column "Number of AC services" in the given list"
     Selected Group: ["Number of AC services", AC services requested", "Price per AC service"]
     Ambiguous Term: "AC services"
     Reason: "'AC services' term can cause ambiguity for the column of interest, making it unclear which column is being referred to and generalise to all the columns in the given list"

     Example 8: 
     Column of Interest: "Department"
     Given List of Similar Columns: ["Department", "Section", "Category"]
     History: None
     Selected Group: []
     Ambiguous Term: 'Null'
     Reason: "There is no column lexically similar to Department, hence an ambiguous term cannot be created"

     Example 9:
     Column of Interest: "managerName"
     Given List of Similar Columns: ["employeeName", "departmentName", "contactNo", "head"]
     History: None
     Selected Group: ["employeeName", "departmentName"]
     Ambiguous Term: "Name"
     Reason: "The column of interest 'managerName' contains 'Name' which also appears in the two selected columns and 'Name' itself is not a column name in the given list."  

     Example 10:
     Column of Interest: "transaction_number"
     Given List of Similar Columns: ["transaction_id", "customer_id", "customer_contact", "credit_card_transaction", "amount_transaction"]
     History: None
     Selected Group: ["transaction_id", "credit_card_transaction", "amount_transaction"]
     Ambiguous Term: "transaction"
     Reason: "The column of interest 'transaction_number' contains 'transaction' which also appears in the three selected columns and 'transaction' itself is not a column name in the given list."  


     ### **Inputs**
     
     Column of Interest:
     {coi}

     List of Similar Columns:
     {subset_columns}

     History:
     {history_term}

     ### **Outputs**
    
     **Your response must follow these instructions**:
     {format_instructions}

  semantic_term_prompt: |
      You are a SQL expert specializing in natural language (NL)-to-SQL semantics and schema analysis.

      You are given a column of interest and a list of other columns from a database.
      You must:
      1. Analyze the Given List of Columns and identify a subset of columns that are semantically similar to the `Column of Interest`.
      2. Combine `Column of Interest` with the identified subset of columns.
      3. Generate an ambiguous term that is semantically similar to every column name in the combined list, and can represent each of the column names in this list.

      # **Instructions**
      You must strictly follow these rules to complete the task:

      1.  **Group Selection**: From the `Given List of Columns`, identify a group of one or more columns that are semantically similar to the `Column of Interest`.
          * A group of terms are semantically similar **ONLY IF**:
            - two or more columns share meaning based on their underlying concepts, such that they refer to related or overlapping ideas in a knowledge space, even if they are not identical in wording.
          * Infer each column's underlying concept from the values it would potentially contain (data type), and group columns only when those inferred concepts—and their value domains—clearly align.
          * Do not group columns just because they share a word if they represent different entities (e.g., 'Customer Name' and 'Department Name' are both names but for different things and should not be grouped).
          * This subset forms `Selected Group` of columns that are all semantically similar.
          * If there's no semantically similar column in the list return `[]` as `Selected Group`.

      2. **Generate a Combined List**: Combine the `Selected Group` and `Column of Interest` to form a new list of columns.
          * DO NOT add any extra columns to the `Selected Group` and `Column of Interest`.
          * `Combined List` must contain two or more columns for ambiguous term generation.

      3.  **Ambiguous Term Generation**: Use `Combined List` to generate an **Ambiguous Term**.
          * **Ambiguous Term**: Generate an ambiguous term that represents higher-level category, concept, or synonym for the `Combined List`(e.g., "expenses" is a good generalization for 'order_cost', 'annual_cost', 'registration_fee').
            - The term must be applicable to all the columns in the combined list.
            - The generated term should represent specific category or concept linked to the combined list.
            - The generated term should be singular; for example, use the term 'detail' instead of 'details'.
          * **Avoid Specific Tokens**: Do not use unique or defining words from the column names in your term. For example, 'code' term is a specific token from column 'postal code', so it is incorrect.
          * **No Exact Matches**: The term must not be an exact match for any column name.
          * **Handle Null Cases**: If `Combined List` is an empty list `[]` or contains only one column, then `Ambiguous Term` must be `"Null"`.
          * **Use Context**: Leverage the `Reference Natural Language Query` and `History` to understand the context and avoid past errors.
          * **Constraints**:
              - Use clear, everyday language that a non-technical stakeholder would understand; avoid jargon and umbrella terms, and prefer specific, familiar words.
              - Do not overgeneralize the ambiguous term used for columns in the `Combined List`. Instead, create a more specific ambiguous term that is relevant to the `Combined List`.
                - For example, "Financial Metrics" is not a correct term for columns "discount_code", "payment_method", and "currency_type" as these columns are related to transactions, they do not represent actual financial metrics. A specific ambiguous term for this case could be "Transaction Metadata".
              - If a specific ambiguous term cannot be generated for `Combined List` then return `"Null"`.
              - Ignore the case (uppercase or lowercase), singular plural and minor variations when generating an ambiguous term for the selected group. For example:
                  - 'no.', 'number' or '#' represent the same word or token. 
                  - 'Identifier', 'ID', or 'identity' represent the same word or token.

      4.  **Reasoning**: Provide a concise reason explaining every step that was taken to generate the `Ambiguous Term` and why the `Ambiguous Term` is a good generalization for the `Column of Interest` and the `Selected Group`.

      ### **Examples**
      *The following examples demonstrate the desired input-to-output behavior.*


      **Example 1: Grouping by High-Level Concept**
      `Column of Interest`: "Software Bug"
      `Given List of Columns`: ["Security Breach", "Hardware Cost", "Malfunctions in Hardware", "External Device #", "Hardware Failure", "Requested Services"]
      `History`: None
      `Reference Natural Language Query`: "What is the count of the software bugs faced by the IT department?"
      ---
      `Selected Group`: ["Security Breach", "Malfunctions in Hardware", "Hardware Failure"]
      `Ambiguous Term`: "issue"
      `Reason`: "'issue' is a high-level category that covers various problems, whether they are software defects, security incidents, or hardware failures."

      **Example 2: Correcting Based on History (Shared Token)**
      `Column of Interest`: "Completion Date"
      `Given List of Columns`: ["Registration Date", "Order ID", "Contact Email", "Purchase Date", "Customer Name"]
      `History`: "The previous term 'date' was invalid because it is a direct token found within the column names 'Registration Date' and 'Purchase Date'."
      `Reference Natural Language Query`: "Return the completion date for order # 10962"
      ---
      `Selected Group`: ["Registration Date", "Purchase Date"]
      `Ambiguous Term`: "timeframe"
      `Reason`: "'timeframe' is a suitable generalization for columns that specify different points in time, such as when something was completed, purchased, or registered."

      **Example 3: Correcting Based on History (Exact Match)**
      `Column of Interest`: "cost"
      `Given List of Columns`: ["annual_cost", "buyer_id", "seller_organisation", "order_cost", "buyer_contact_number", "seller_contact_number", "registration_fee", "seller_commission_fee"]
      `History`: "The previous term 'cost' was invalid because it is an exact match with the column of interest."
      `Reference Natural Language Query`: "What is the cost associated with orders placed by each buyer?"
      ---
      `Selected Group`: ["annual_cost", "order_cost", "registration_fee", "seller_commission_fee"]
      `Ambiguous Term`: "expense"
      `Reason`: "'expense' serves as a general synonym that encompasses different types of financial outlays like annual costs, order costs, and fees."

      **Example 4: Using a Synonym for a Category**
      `Column of Interest`: "violation_fine"
      `Given List of Columns`: ["sales_tax", "transaction_id", "due_date", "late_fee", "created_at", "status", "description", "non_compliance_penalty"]
      `History`: None
      `Reference Natural Language Query`: "Display the due date of the violation fine created in January 2021."
      ---
      `Selected Group`: ["sales_tax", "late_fee", "non_compliance_penalty"]
      `Ambiguous Term`: "levy"
      `Reason`: "'levy' is a generalized term for a financial charge imposed by an authority, which accurately covers fines, taxes, and fees."

      **Example 5: Generalizing Metrics into a Concept**
      `Column of Interest`: "completedProjects"
      `Given List of Columns`: ["salesHead", "salesAchieved", "projectsCompleted", "salesCost", "employeeID", "scoreReceived", "deptName", "manager"]
      `History`: None
      `Reference Natural Language Query`: "How many projects are completed by the employee with id 78901?"
      ---
      `Selected Group`: ["salesAchieved", "projectsCompleted", "scoreReceived"]
      `Ambiguous Term`: "performance"
      `Reason`: "'performance' is a high-level metric that generalizes various measures of achievement, such as completed projects, sales targets, and scores."

      **Example 6: Handling the Null Case**
      `Column of Interest`: "transactionNo"
      `Given List of Columns`: ["customerID", "customerContact", "branchName", "recipientID"]
      `History`: None
      `Reference Natural Language Query`: "What are the transaction numbers linked with recipient 1445?"
      ---
      `Selected Group`: []
      `Ambiguous Term`: "Null"
      `Reason`: "No columns in the given list are semantically similar to 'transactionNo', so no group can be formed and no ambiguous term can be generated."

      ### **Inputs**
      `Column of Interest`:
      {coi}

      `Given List of Columns`:
      {subset_columns}

      `History`:
      {history_term}

      `Reference Natural Language Query`:
      {question}

      ### **Output**
      *Strictly generate the response using the format below. Do not generate any other content, text, or explanations.*
      {format_instructions}
  
  confusion_term_prompt: |
     You are a SQL expert specializing in natural language (NL)-to-SQL translation and data generation.
     Your task is to generate a **confusing** term from a list of database columns and a column of interest.
     You must convert the column of interest into a confusing term.
     A term is confusing if it satisfies the following conditions:
     1. The term is in the same domain of the database columns.
     2. The term is lexically amd semantically different from all of the columns in the database.
     3. The term cannot be directly translated to any of the columns from the database. 
     
     ### **Instructions**
     The following instructions must be strictly followed:
     1. **Database Columns Analysis**: Analyze the list of the given columns and identify the domain of the database.
     2. **Term Generation**: Generate a confusing term from the column of interest that cannot be directly translated or mapped to any of the columns.
        - The confusing term MUST NOT be lexically or semantically similar to any of the columns in the database.
        - The confusing term MUST NOT be translated or mapped to any of the columns in the database.
        - The confusing term MUST be from the same domain of the given list of columns.
        - Do not use vague generic terms.
        - Ignore the case (uppercase or lowercase), singular plural and minor variations when generating an ambiguous term for the selected group. For example:
        - If a confusing term cannot be generated use 'Null' for confusing term.
     3. **Constraints**:
        - Take into consideration the history, if provided, when generating the response. 
            - The history contain errors linked with the term generated in the previous attempt(s).
            - Strictly use the history to generate a valid confusing term.
     4. **Format**: Strictly generate the response using the given output format. DO NOT generate any other content or text.
    
     ### **Inputs**
     
     Column of Interest:
     {coi}

     List of Database Columns:
     {dataset_columns}

     History:
     {history_term}

     ### **Outputs**
    
     **Your response must follow these instructions**:
     {format_instructions}

  confusion_value_prompt: |
     You are a SQL expert specializing in natural language (NL)-to-SQL translation and data generation.
     Your task is to generate a **confusing** value for a selected values, whose list of values are provided.
     A value is confusing if it satisfies the following two conditions:
     1. The value is in the same domain the given list of values.
     2. The value is not an exact match to any of the values in the given list.
     
     ### **Instructions**
     The following instructions must be strictly followed:
     1. **Column Values Analysis**: Analyze the list of the given values and identify the domain values of the column. For example:
         - Textual values such as "Full Name", "Emails", "Company Name", "Course Name", "Full Address"
         - Numerical values such as Age, Temperature, Date, Phone # or Room #
         - Categorical values such as Gender, Status, Job Designation, Country        
     2. **Value Generation**: Generate a confusing value for given the column of interest that does not matches any of the values in the given column. 
        - The generated value MUST correspond to the domain type. For example:
            - For textual data, either a new textual value is generated that is not present in the given list, or a misspelled or singular/plural variant of one of the values in the list is produced.
            - For numerical value, generate a value that is not present in the given list but falls within the constraints of the identified domain e.g., a body temperature value.
            - For categorical value, generate a categorical value within the constraints of the identified domain which does not exist in the given list. For example, for country "USA", the confusion value could be "United States of America".
     3. **Constraints**:
        - Take into consideration the history, if provided, when generating the response. 
            - The history contain errors linked with the values generated in the previous attempt(s).
            - Strictly use the history to generate a valid confusing value.
     4. **Format**: Strictly generate the response using the given output format. DO NOT generate any other content or text.
    
     ### **Inputs**
     
     Column of Interest:
     {coi}

     List of Values Linked with Column of Interest:
     {coi_value}

     History:
     {history_term}

     ### **Outputs**
    
     **Your response must follow these instructions**:
     {format_instructions}

  lexical_term_ambiguity_eval_prompt: |
   You are a database analyst specializing in extracting relevant columns from a database. You are given a term and a list of columns. Your task is to analyze the list of columns and the given term to determine whether the term is lexically similar to the columns and represents an ambiguous term, without being an exact match or a direct representation of any of them.
    
   ### **Definition**

   **Ambiguity**: Ambiguity arises between a term and list of columns if it is not clear which column name is being referred by the term in the given list. A valid ambiguous term can be linked with more than one column in the given list.
    * The following conditions must be met for a valid ambiguous term:
        * The ambiguous term should be lexically similar to two or more columns in the list in terms of wording, length, and style.
            * Lexical similarity involves sharing same tokens, words or segments.
            * If a term can be linked to two or more columns of the given list then it qualifies for valid ambiguity.
        * The entire ambiguous term should be linked with two or more columns. If the entire term cannot be linked with the given columns, then it is invalid. For example:
            * 'primary contact', the entire term, can be linked to "primary contact name" and "primary contact address" raising ambiguity in column selection. 
            * 'secondary email' cannot be linked to "contact email" and "secondary address" as the entire term cannot be associated with the mentioned two columns. Such cases do not qualify for valid ambiguity.
        * The ambiguous term must not exactly match the name of any column in the provided list.
            * An exact match is only allowed if it refers to a single, specific column in the list. This represents invalid ambiguity.
            * If the term can be linked with more than one columns, then it holds valid ambiguity.
        * The ambiguous term should not be a generic synonym or paraphrased word e.g., if the list contains columns "Employee Title" and "Employee Designation" then "person" term is invalid as it is a synonym of "Employee" and there is no column that could be lexically linked with "person" term.
    * **Constraints**
        * Ignore the case (uppercase or lowercase), singular plural and minor variations during the comparison and analysis For example:
            *'Customer Count', 'customer count', 'CUSTOMER COUNT', 'customer_count' and 'customer counts' represent the same column. 
            * 'no.', 'number' or '#' represent the same word or token. 
            * 'Customer Count' and 'Count Customer' represent the same column. 
    * **Examples fo Valid Ambiguity:** 
         * "student" is a valid ambiguous term for ["Student ID", "Program Start Date", "Course ID" , "Program End Date", "Student First Name", "Student Last Name" ] as it can be linked to multiple columns "Student ID", "Student First Name", and "Student Last Name" columns, causing ambiguity in column selection.
         * "Sales - Contact Number" is a valid ambiguous term for ["Sales - Customer Home Number", "Sales - Customer Office Number", "Sales - Customer ID", "Purchases - Employee ID"] as it causes ambiguity in selecting column either "Sales - Customer Home Number" or "Sales - Customer Office Number".
         * "employee" is a valid ambiguous term for ["name_employee", "ID_employee", "contact_employee"] as "employee" segment is applicable to all the columns in the list and does not have an exact match with any of the columns.
         * "dept" is a valid ambiguous term for ["DeptID", "HeadID", "DeptName","HeadName", "HeadEmail", "DepartEmail"] as it can be maped to columns "DeptID", "DeptName", and "DepartEmail", not clarifying which one is being referred to.
         * "cost info" is a valid ambiguous term for ["Cost", "Annual Cost", "Monthly Cost"] as it can be associated with all the columns, as 'info' could be linked with any of the columns.
         * "student_name" is a valid ambiguous term for ["student_id", "student_first_name", "student_last_name", "course_enrolled", "program_enrolled"] as the entire term can be linked to "student_first_name" and "student_last_name" columns.
         * "given name" is a valid ambiguous term for ["customer id", "customer given name", "customer last name", "employee id", "employee given name", "employee last name" ,"employee contact"] as the term can be linked with "employee given name" and "customer given name" columns.
    * **Examples of Invalid Ambiguity:**      
         * "purchase date" is an invalid ambiguous term for ["Purchase Date", "Purchase Date Approved", "Purchase Date Initiated"] as it has an exact match with "Purchase Date" in the given list.
         * "manager employee" is an invalid ambiguous term for ["Manager Employee Name", "Manager Employee StartDate", "Employee Manager", "Manager Employee Contact"] as it can be mapped to "Employee Manager" column.
         * "finance dept" is an invalid ambiguous term for ["Finance Department", "Corporate Finance Department", "Finance Planning Department", "HR Department"] as "finance dept" is another variant of "Finance Department" in the list and does not represent ambiguity.
         * "code" is an invalid ambiguous term for ["zipcode", "street number", "unit", "state" ] as "code" can directly map to "zipcode". To qualify for ambiguity criterion, the term must be lexically similar to at least two columns.
         * "employee salaries" is an invalid ambiguous term for ["Employee ID", "Employee Name", "Employee Salary", "Employee Salary Level", "Employee Designation"] as it represents a variant of "Employee Salary" column. Therefore, it does not qualify for ambiguity criterion.
         * "customer_number" is an invalid ambiguous term for ["customer_id", "customer_registration", "customer_contact", "employee_contact", "employee_number"] as the entire term cannot be linked with any of the columns in the list . Therefore, it does not qualify for ambiguity criterion.
   
    ### **Instructions**

    1.  **Analyze**: 
         * Compare the `Given Term` with each column of the `Given Column List` using the given `Ambiguity` definition.
         * Focus on the conditions of the ambiguity criterion to identify valid ambiguous term.
    2.  **Decide**: Outcome is `"valid"` if the term is ambiguous. Otherwise, its `"invalid"`.
    3.  **Explain**: Provide a brief reason for your decision.
    4.  **Constraints**:
         * Base your reason strictly on the provided definitions.
         * The reason should be specific to the given term and list of columns.
         * Do not use any external knowledge or make assumptions.
    5.  **Format**: Structure your entire response according to the `Output Format` instructions

    
    ### **Inputs**

    Given Term:
    {term}
    
    Given List of Columns:
    {dataset_columns}

    ### **Outputs**
    
    **Your response must follow these instructions**:
    {format_instructions}

  semantic_term_ambiguity_eval_prompt: |
   You are a database analyst specializing in extracting relevant columns from a database. You are given a term and a list of columns. Your task is to analyze the list of columns and the given term to determine whether the term is semantically similar to the columns and represents an ambiguous term, without being an exact match or a direct representation of any of them.
    
   ### **Definition**

   **Ambiguity**: Ambiguity arises between a term and list of columns if it is not clear which column name is being referred by the term in the given list. A valid ambiguous term can be linked with more than one column in the given list.
    * The following conditions must be met for a valid ambiguous term:
        * The ambiguous term should be semantically similar to two or more columns in the list i.e., a term and column share meaning based on their underlying concepts, such that they refer to related or overlapping ideas in a knowledge space, even if they are not identical in wording. Infer each column's underlying concept from column names and values it would potentially contain (data type).
            * If a term can be linked to two or more columns of the given list then it qualifies for valid ambiguity.
            * Ambiguous term must represent a high-level concept or category e.g., "person" can represent "Employee" and "Manager" columns.
            * If the ambiguous term is lexically similar to columns in the given list, not semantically similar, then it is invalid
        * The entire ambiguous term should be linked with two or more columns. If the entire term cannot be linked with the given columns, then it is invalid. For example:
            * 'personal information', the entire term, can be linked to "primary contact name" and "primary contact address" raising ambiguity in column selection. 
        * The ambiguous term must not exactly match or map to a single column in the provided list.
            * The identified ambiguous term should not contain keyword that could be linked any column e.g., if 'ZipCode', 'Address' and 'PO Box' are columns in the given list then 'code' is an invalid ambiguous term as 'code' keyword exist in 'ZipCode'.
        * The ambiguous term should not be a generic term e.g., 'data' or 'information' are invalid terms as majority of the columns can be linked with these generic terms.
    * **Constraints**
        * Ignore the case (uppercase or lowercase), singular plural and minor variations during the comparison and analysis For example:
