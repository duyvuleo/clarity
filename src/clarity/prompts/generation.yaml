  conv_generator_prompt_single: |
    You are a SQL expert specializing in natural language (NL)-to-SQL translation and data generation.
    You are given a seed user and agent conversation that represents addressing ambiguous user requests. The ambiguous version represents a natural language query that cannot be converted into SQL statement as the specification of columns is not clear.
    Your task is to revise and extend  the given conversation between user and agent depending on the type of conversation . This involves following steps:
    i- Revise the initial 'AGENT' response to be more human-like, while preserving the column names mentioned in the query. Retain the original 'USER' response during the revision.
        - Here is an example for 'AGENT' response revision:
            Input Seed Conversation: [{{'role':'USER','content':'show count of orders by employee id sorted on employee name'}},
                                      {{'role': 'AGENT', 'content': 'We noticed that "orders" could mean "Total Orders", "Yearly Orders", and "Monthly Orders". Could you please clarify which one you mean?'}}]
            Revised Seed Conversation: [{{'role':'USER','content':'show count of orders by employee id sorted on employee name'}},
                                        {{'role': 'AGENT', 'content': 'when you say "orders," are you referring to "Total Orders", "Yearly Orders", or "Monthly Orders"?'}}]
    ii- Extend the revised conversation to generate 'USER' and 'AGENT' responses depending on the given conversation type. Specific instructions for different types of conversation are given below. Strictly follow the given instructions

    ### **Types of Conversation**
    1. Helpful:
    - Generate the "USER" response where the given ground truth column is specified to address the ambiguity
    - Following types of "USER" response to address ambiguity can be generated
        - Concise: A direct mention of the given ground truth column name 
        - Verbose: A natural response suggesting the column name. The column name must appear in the response. Do not generate elaborative response.
    - Afterwards, generate 'AGENT' response which is the given SQL query.
    - Here is an example of concise and verbose helpful response
        Input Seed Conversation: [{{'role':'USER','content':'show count of orders by employee id sorted on employee name'}},
                                  {{'role': 'AGENT', 'content': 'We noticed that "orders" could mean "Total Orders", "Yearly Orders", and "Monthly Orders". Could you please clarify which one you mean?'}}]
        Input Ground Truth Column: ["Monthly Orders"]
        SQl Query : 'SELECT count("Monthly Orders"), "Employee ID" FROM my_data'

        Generated Conversation - Concise: [{{'role':'USER','content':'show count of orders by employee id sorted on employee name'}},
                                           {{'role': 'AGENT', 'content': 'It looks like "orders" could mean "Total Orders", "Yearly Orders", or "Monthly Orders". Could you clarify which one you're talking about?'}}
                                           {{'role':'USER','content':'monthly order'}},
                                           {{'role': 'AGENT', 'content': 'SELECT count("Monthly Orders"), "Employee ID" FROM my_data'}}]

        Generated Conversation - Verbose: [{{'role':'USER','content':'show count of orders by employee id sorted on employee name'}},
                                           {{'role': 'AGENT', 'content': 'When you say "orders", are you referring to "Total Orders", "Yearly Orders", or "Monthly Orders". Could you clarify which one you're talking about?'}},
                                           {{'role':'USER','content': 'I want monthly orders'}},
                                           {{'role': 'AGENT', 'content': 'SELECT count("Monthly Orders"), "Employee ID" FROM my_data'}}]

    2. Partially Helpful:
    - Generate the "USER" response where the given ground truth column is specified to address the ambiguity but exact column name is not used
    - A variant of ground truth is generated without losing a context and column name. This represent a correct low quality response from the user
      - Do not use the exact same column name. Instead, create a unique variant by including a segment of the original column name. 
      - The initial seed "AGENT" response mentions multiple column options for selection, so this variant be specific to the ground truth column and should not be mixed or confusion with other columns in the "AGENT" response.
         - For example, if the columns are named 'total_students' and 'enrolled_students,' the variant should be 'total' or 'enrolled' to clearly identify which column is being referenced.
      - The variant should not change or paraphrase the column name e.g., 'customer id' is incorrect variant of 'client id'
      - Only use the generated column variant as the 'USER' response. 
    - After the user response is generated, the agent rewrites the original user request containing ambiguity, by replacing the ambiguous term with the column name specified by the user
    - Maintain the original question's tone and phrasing style.
    - Here is an example of partially helpful response
        Input Seed Conversation: [{{'role':'USER','content':'show count of orders by employee id sorted on employee name'}},
                                  {{'role': 'AGENT', 'content': 'We noticed that "orders" could mean "Total Orders", "Yearly Orders", and "Monthly Orders". Could you please clarify which one you mean?'}}]
        Input Ground Truth Column: ["Monthly Orders"]
        SQl Query : 'SELECT count("Monthly Orders"), "Employee ID" FROM my_data'                     
        
        Generated Conversation: [{{'role':'USER','content':'show count of orders by employee id sorted on employee name'}},
                                 {{'role': 'AGENT', 'content': 'It is a bit unclear — does "orders" refer to "Total Orders", "Yearly Orders", or "Monthly Orders"'}}
                                 {{'role':'USER','content':'monthly'}},
                                 {{'role': 'AGENT', 'content': 'SELECT count("Monthly Orders"), "Employee ID" FROM my_data'}}]

    3. Not Helpful:
    - Generate a "USER" response where a useful and helpful response is not given by a user. Hence, user is not helping in resolving the ambiguity. Generate a "USER" response for the following cases:
        - Random Column: Generate a response where column selection is not provided and any one of the options can be selection, such as "choose any" or "use one of the them".
        - No Column: Generate a response where there is no clarity on the column selection, such as "I don't know", "I am not sure", "No idea", or "I don't know for certain".
    - For such "USER"response, the 'AGENT' response must be accordingly generated.
        - Random Column: if the user request choosing any of the columns without providing a specific column name, then choose any one of the columns from the previous 'AGENT' response and replace the given ground truth column in the given SQL query. The revise SQL query serves as the 'AGENT' response.
        - No Column: if the column is not specified then the 'AGENT' response should reflect that user's response is unhelpful and the query cannot be generated. 
    - Here are examples of not helpful response:
        Input Seed Conversation: [{{'role':'USER','content':'show count of orders by employee id sorted on employee name'}},
                                  {{'role': 'AGENT', 'content': 'We noticed that "orders" could mean "Total Orders", "Yearly Orders", and "Monthly Orders". Could you please clarify which one you mean?'}}]
        Input Ground Truth Column: ["Monthly Orders"]
        SQl Query : 'SELECT count("Monthly Orders"), "Employee ID" FROM my_data'    

        Generated Conversation - Random Column: [{{'role':'USER','content':'show count of orders by employee id sorted on employee name'}},
                                             {{'role': 'AGENT', 'content': '"orders" could refer to "Total Orders", "Yearly Orders", or "Monthly Orders". Could you specify which one you meant?'}}
                                             {{'role':'USER','content': 'I am not sure. just pick one.'}},
                                             {{'role': 'AGENT', 'content': 'SELECT count("Total Orders"), "Employee ID" FROM my_data' }}]
        
        Generated Conversation - No Column: [{{'role':'USER','content':'show count of orders by employee id sorted on employee name'}},
                                 {{'role': 'AGENT', 'content': '"orders" could refer to "Total Orders", "Yearly Orders", or "Monthly Orders". Could you specify which one you meant?'}}
                                 {{'role':'USER','content': 'I don't know.'}},
                                 {{'role': 'AGENT', 'content': 'The query cannot be generated as "orders" cannot be mapped to a column name'}}]
        
        
    ### ***Other Instructions**
    - Generate the response based on the given conversation type.
    - Wherever applicable, the response for 'USER' and 'AGENT' should have human-like tone and style.
    - Use only the given information. Do not make assumptions.
    - The final response should be a complete conversation. 
    - Only generate the user and agent conversation in the requested format. DO NOT generate any other explanation or response.

      
    ### ***Inputs**:
    Conversation Type:
    {type}

    Seed Conversation:
    {conversation}

    Ground Truth Column:
    {cois}

    SQL Query:
    {expected_query}

    Output:
